name: TreadmillRemote
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  TreadmillRemote:
    type: application
    platform: iOS
    sources:
      - path: TreadmillRemote
    resources:
      - path: TreadmillRemote/Assets.xcassets
    info:
      path: TreadmillRemote/Info.plist
      properties:
        CFBundleDisplayName: Treadmill Remote
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSBluetoothAlwaysUsageDescription: Bluetooth is used to discover and control your BLE treadmill.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TreadmillRemote
        PRODUCT_NAME: TreadmillRemote
        INFOPLIST_FILE: TreadmillRemote/Info.plist
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
